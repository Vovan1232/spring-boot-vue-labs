spring.application.name=article-ai
server.address=127.0.0.1
server.port=${PORT:8085}
spring.ai.openai.api-key=${OPENAI_API_KEY:local-no-key}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0
spring.ai.openai.chat.options.response-format.type=JSON_OBJECT
spring.ai.retry.max-attempts=1
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=35s
